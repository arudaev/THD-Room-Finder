name: Sync campus-study project

on:
  issues:
    types: [opened, reopened, closed, assigned, labeled]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: project-sync-${{ github.event.issue.number || github.event.pull_request.number || 'reconcile' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
    steps:
      - name: Explain credential requirement
        if: ${{ env.PROJECTS_TOKEN == '' }}
        run: echo 'Native project workflows remain active. Custom ready-for-review synchronization needs a scoped PROJECTS_TOKEN; no administrator token is copied automatically.'
      # Never check out or execute the PR head with a privileged token.
      - uses: actions/checkout@v4
        if: ${{ env.PROJECTS_TOKEN != '' }}
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        if: ${{ env.PROJECTS_TOKEN != '' }}
        with:
          github-token: ${{ env.PROJECTS_TOKEN }}
          script: |
            await require('./.github/scripts/project-sync.cjs')({github, context, core});
