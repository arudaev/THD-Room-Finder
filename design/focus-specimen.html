<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Individual focus — interaction specimen</title>
  <link rel="stylesheet" href="../src/styles/tokens/colors.css">
  <link rel="stylesheet" href="../src/styles/tokens/elevation.css">
  <link rel="stylesheet" href="../src/styles/tokens/spacing.css">
  <style>
    :root { --study-violet:#EDE5FF; --study-on-violet:#493276; --study-apricot:#FFE6D1; --study-on-apricot:#6A3B16; --study-ochre:#F5EDC8; --study-on-ochre:#5A4A16; }
    [data-theme="dark"] { --study-violet:#3D3058; --study-on-violet:#EBDEFF; --study-apricot:#513B2C; --study-on-apricot:#FFDFC5; --study-ochre:#494329; --study-on-ochre:#F7EDB2; color-scheme:dark; }
    * { box-sizing:border-box; } body { margin:0; background:var(--md-bg); color:var(--md-on-surface); font:16px/1.5 system-ui,sans-serif; }
    header,main { max-width:var(--content-wide); margin:auto; padding:var(--space-6); } header { padding-bottom:0; }
    h1 { font-size:1.8rem; letter-spacing:-.04em; margin:.3rem 0; } h2 { font-size:1.15rem; margin:0; } h3,p { margin:0 0 var(--space-3); }
    .muted,small { color:var(--md-on-surface-variant); } .eyebrow { font-size:.75rem; letter-spacing:.09em; text-transform:uppercase; color:var(--md-primary); }
    .controls,.actions,.row { display:flex; flex-wrap:wrap; gap:var(--space-3); align-items:center; } .controls { margin-top:var(--space-5); padding:var(--space-4); background:var(--md-surface-1); border-radius:var(--radius-l); }
    label { display:grid; gap:var(--space-1); font-size:.875rem; flex:1 1 150px; } button,select,input { font:inherit; }
    button,select { min-height:var(--tap-target); border:0; border-radius:var(--radius-xl); padding:.65rem 1rem; }
    button { cursor:pointer; background:var(--md-primary); color:var(--md-on-primary); font-weight:600; } select { width:100%; background:var(--md-surface); color:var(--md-on-surface); box-shadow:var(--md-shadow-1); }
    button.secondary { background:var(--md-secondary-container); color:var(--md-on-secondary-container); } button:focus-visible,select:focus-visible,input:focus-visible { outline:3px solid var(--md-primary); outline-offset:3px; }
    .layout { display:grid; grid-template-columns:1.1fr 1fr; gap:var(--space-6); } .card { background:var(--md-surface); border-radius:var(--radius-xl); padding:var(--space-6); box-shadow:var(--md-shadow-1); }
    .room-code { font-size:3.1rem; letter-spacing:-.06em; margin:.5rem 0; } .saved { color:var(--md-primary); }
    .availability { padding:var(--space-4); border-radius:var(--radius-l); background:var(--md-tertiary-container); color:var(--md-on-tertiary-container); margin-bottom:var(--space-4); }
    .activity { padding:var(--space-4); border-radius:var(--radius-l); background:var(--study-violet); color:var(--study-on-violet); margin-bottom:var(--space-4); }
    .activity.coarse { background:var(--md-surface-1); color:var(--md-on-surface-variant); } .activity.unknown { background:var(--study-ochre); color:var(--study-on-ochre); }
    .pill { display:inline-flex; align-items:center; gap:.4rem; padding:.3rem .7rem; border-radius:var(--radius-full); background:var(--study-violet); color:var(--study-on-violet); font-size:.8rem; }
    .palette { display:flex; gap:var(--space-2); margin:var(--space-4) 0; flex-wrap:wrap; } .apricot { background:var(--study-apricot); color:var(--study-on-apricot); } .ochre { background:var(--study-ochre); color:var(--study-on-ochre); }
    .timer { font-size:2.9rem; font-variant-numeric:tabular-nums; letter-spacing:-.05em; margin:var(--space-2) 0; } .stack { display:grid; gap:var(--space-4); } .section-label { margin:var(--space-6) 0 var(--space-3); }
    .room-row { display:flex; gap:var(--space-4); padding:var(--space-4); background:var(--md-surface); border-radius:var(--radius-l); box-shadow:var(--md-shadow-1); margin-bottom:var(--space-3); align-items:center; } .room-row strong { min-width:3.7rem; } .room-row small { display:block; } .room-row .time { color:var(--md-tertiary); margin-left:auto; white-space:nowrap; }
    dialog { width:min(540px,calc(100% - 2rem)); max-height:90dvh; overflow:auto; background:var(--md-surface); color:var(--md-on-surface); border:0; border-radius:var(--radius-xl); padding:var(--space-6); box-shadow:var(--md-shadow-2); } dialog::backdrop { background:rgb(0 0 0/.4); }
    dialog label { margin:var(--space-4) 0; } .check { display:flex; min-height:var(--tap-target); align-items:center; gap:var(--space-3); } .check input { width:1.2rem; height:1.2rem; } .note { padding:var(--space-3); background:var(--md-surface-1); border-radius:var(--radius-m); font-size:.875rem; }
    @media(max-width:650px) { header,main { padding:var(--space-4); } .layout { grid-template-columns:1fr; gap:var(--space-4); } .card { padding:var(--space-5); } .controls label { flex-basis:42%; } }
    @media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto; } }
  </style>
</head>
<body>
<header>
  <div class="eyebrow" data-copy="eyebrow"></div><h1 data-copy="title"></h1>
  <p class="muted" data-copy="disclaimer"></p>
  <div class="controls" aria-label="Prototype controls">
    <label><span data-copy="language"></span><select id="locale"><option value="en">English</option><option value="de">Deutsch</option></select></label>
    <label><span data-copy="theme"></span><select id="theme"><option value="light">Light / Hell</option><option value="dark">Dark / Dunkel</option></select></label>
    <label><span data-copy="viewerLabel"></span><select id="viewer"></select></label>
    <label><span data-copy="fixtureLabel"></span><select id="fixture"></select></label>
  </div>
</header>
<main>
  <div class="layout">
    <section class="card" aria-labelledby="room-title">
      <div class="row"><span class="saved" data-copy="saved"></span><span class="pill">E · Deggendorf</span></div>
      <h2 class="room-code" id="room-title">E203</h2><p class="muted" data-copy="roomSubtitle"></p>
      <div class="availability"><strong data-copy="free"></strong><div data-copy="timetable"></div></div>
      <div id="activity" class="activity coarse" role="status" aria-live="polite"></div>
      <p id="remembered" class="muted"></p>
      <div class="actions"><button id="start" data-copy="start"></button><button id="end" class="secondary" data-copy="end" hidden></button><button id="adjust" class="secondary"></button></div>
      <p class="muted" style="margin-top:var(--space-4)" data-copy="noBooking"></p>
    </section>
    <section class="stack" aria-labelledby="focus-title">
      <div class="card"><div class="eyebrow" data-copy="focusHeading"></div><h2 id="focus-title" data-copy="focusTitle"></h2><div class="timer" id="timer">50:00</div><p id="focus-state" role="status" aria-live="polite"></p><small data-copy="timerNote"></small></div>
      <div class="card"><h2 data-copy="colorHeading"></h2><div class="palette"><span class="pill" data-copy="violet"></span><span class="pill apricot" data-copy="apricot"></span><span class="pill ochre" data-copy="ochre"></span></div><small data-copy="colorNote"></small></div>
    </section>
  </div>
  <h2 class="section-label" data-copy="nearby"></h2><p class="muted" data-copy="ranking"></p><div id="rooms"></div>
</main>
<dialog id="start-dialog" aria-labelledby="dialog-title">
  <h2 id="dialog-title" data-copy="dialogTitle"></h2><p class="muted" data-copy="identity"></p>
  <label><span data-copy="duration"></span><select id="duration"><option value="30">30 min</option><option value="50" selected>50 min</option><option value="90">90 min</option></select></label>
  <label><span data-copy="modeLabel"></span><select id="mode"></select></label>
  <label><span data-copy="audienceLabel"></span><select id="audience"></select></label>
  <p class="note" id="audience-note"></p>
  <label class="check"><input type="checkbox" id="show-name"><span data-copy="nameConsent"></span></label>
  <p class="muted" data-copy="modeNote"></p>
  <div class="actions"><button id="confirm" data-copy="confirm"></button><button id="cancel" class="secondary" data-copy="cancel"></button></div>
</dialog>
<script type="module">
  const $ = id => document.getElementById(id);
  const copy = {
    en: { eyebrow:'THD Room Finder · interaction specimen', title:'Your room. Your focus.', disclaimer:'Concept · synthetic data · no shared service or real students connected.', language:'Language', theme:'Theme', viewerLabel:'Demo viewer', fixtureLabel:'Demo connection', saved:'★ Saved room', roomSubtitle:'A familiar place to get started.', free:'Free for 2 hours', timetable:'Timetable availability · sample data', start:'Start focus', end:'End focus', noBooking:'Study activity does not reserve this room.', focusHeading:'Individual focus', focusTitle:'One familiar action', timerNote:'Fixed-duration specimen. No background timer or wake lock.', colorHeading:'Clear labels, quiet colors', violet:'Violet · your cohort', apricot:'Apricot · another cohort', ochre:'Ochre · audience', colorNote:'Availability keeps its existing teal, amber and red meanings.', nearby:'Suitable rooms nearby', ranking:'Duration stays visible. Unrelated study activity lowers priority.', dialogTitle:'Focus in E203', identity:'Sample remembered identity: Alex · Applied Computer Science · WS26.', duration:'How long?', modeLabel:'Study mode', audienceLabel:'Who can see it?', nameConsent:'Show my sample display name to the permitted audience', modeNote:'Welcoming company does not change who can see your details.', confirm:'Start this session', cancel:'Cancel', idle:'Ready when you are. Your saved room stays one tap away.', quiet:'Quiet focus', open:'Company welcome', local:'Private local timer', classmates:'Classmates + campus activity', campus:'Campus details', localNote:'Only this device. No activity or identity is shared.', classmatesNote:'Classmates see cohort details. Others see only that study activity is reported here. Your name stays hidden unless selected below.', campusNote:'Selected degree/cohort details are visible to campus viewers. Your name stays hidden unless selected below.', own:'Me', peer:'Same degree + intake', outsider:'Unrelated viewer', healthy:'Connected', reconnecting:'Reconnecting fixture', expired:'Expired fixture', none:'No study activity reported', self:'Your individual session', relevant:'Applied Computer Science · WS26', cohortQuiet:'Same degree and intake · please do not interrupt', coarse:'Study activity reported', unknown:'Study activity unknown', expiredText:'Session expired · start a new segment', reconnectText:'Reconnecting · sharing is not confirmed', localActive:'Private local focus · nothing shared', active:'Focusing in E203', noActivity:'No reported activity', relevantShort:'Your cohort is studying here', busyShort:'Study activity reported', unknownShort:'Activity unknown', restart:'Start a new segment' },
    de: { eyebrow:'THD Room Finder · Interaktionsentwurf', title:'Dein Raum. Dein Fokus.', disclaimer:'Entwurf · Beispieldaten · kein geteilter Dienst und keine echten Studierenden verbunden.', language:'Sprache', theme:'Design', viewerLabel:'Demo-Ansicht', fixtureLabel:'Demo-Verbindung', saved:'★ Gespeicherter Raum', roomSubtitle:'Ein vertrauter Ort zum Loslegen.', free:'Noch 2 Stunden frei', timetable:'Verfügbarkeit laut Stundenplan · Beispieldaten', start:'Fokus starten', end:'Fokus beenden', noBooking:'Lernaktivität reserviert diesen Raum nicht.', focusHeading:'Individueller Fokus', focusTitle:'Ein vertrauter Schritt', timerNote:'Entwurf mit fester Dauer. Kein Hintergrund-Timer oder Wachhaltemodus.', colorHeading:'Klare Beschriftung, ruhige Farben', violet:'Violett · deine Studiengruppe', apricot:'Apricot · andere Studiengruppe', ochre:'Ocker · Sichtbarkeit', colorNote:'Verfügbarkeit behält die bisherigen Bedeutungen von Türkis, Gelb und Rot.', nearby:'Geeignete Räume in der Nähe', ranking:'Die Dauer bleibt sichtbar. Fremde Lernaktivität senkt die Priorität.', dialogTitle:'Fokus in E203', identity:'Gespeicherte Beispielidentität: Alex · Angewandte Informatik · WS26.', duration:'Wie lange?', modeLabel:'Lernmodus', audienceLabel:'Wer kann es sehen?', nameConsent:'Meinen Beispielnamen für die gewählte Zielgruppe anzeigen', modeNote:'Gesellschaft willkommen zu heißen ändert die Sichtbarkeit deiner Details nicht.', confirm:'Diese Sitzung starten', cancel:'Abbrechen', idle:'Bereit, wenn du es bist. Dein gespeicherter Raum bleibt schnell erreichbar.', quiet:'In Ruhe lernen', open:'Gesellschaft willkommen', local:'Privater lokaler Timer', classmates:'Studiengruppe + Campus-Aktivität', campus:'Campus-Details', localNote:'Nur auf diesem Gerät. Keine Aktivität oder Identität wird geteilt.', classmatesNote:'Deine Studiengruppe sieht passende Details. Andere sehen nur eine gemeldete Lernaktivität. Dein Name bleibt verborgen, sofern unten nicht gewählt.', campusNote:'Gewählte Studiengangs- und Studienstartdetails sind für Campus-Besucher sichtbar. Dein Name bleibt verborgen, sofern unten nicht gewählt.', own:'Ich', peer:'Gleicher Studiengang + Studienstart', outsider:'Andere Person', healthy:'Verbunden', reconnecting:'Test: Verbindung unterbrochen', expired:'Test: abgelaufen', none:'Keine Lernaktivität gemeldet', self:'Deine individuelle Sitzung', relevant:'Angewandte Informatik · WS26', cohortQuiet:'Gleicher Studiengang und Studienstart · bitte nicht stören', coarse:'Lernaktivität gemeldet', unknown:'Lernaktivität unbekannt', expiredText:'Sitzung abgelaufen · neuen Abschnitt starten', reconnectText:'Verbindung wird hergestellt · Teilen nicht bestätigt', localActive:'Privater lokaler Fokus · nichts geteilt', active:'Fokus in E203', noActivity:'Keine Aktivität gemeldet', relevantShort:'Deine Studiengruppe lernt hier', busyShort:'Lernaktivität gemeldet', unknownShort:'Aktivität unbekannt', restart:'Neuen Abschnitt starten' }
  };
  let active = false;
  let settings = { duration:'50', mode:'quiet', audience:'classmates', name:false };
  const text = key => copy[$('locale').value][key];
  function options(id, values) { const previous=$(id).value; $(id).replaceChildren(...values.map(([value,key])=>{const option=document.createElement('option'); option.value=value; option.textContent=text(key); return option;})); if(values.some(([value])=>value===previous)) $(id).value=previous; }
  function audienceNote() { $('audience-note').textContent=text($('audience').value+'Note'); $('show-name').disabled=$('audience').value==='local'; }
  function render() {
    document.documentElement.lang=$('locale').value;
    document.querySelectorAll('[data-copy]').forEach(element=>element.textContent=text(element.dataset.copy));
    options('viewer',[['own','own'],['peer','peer'],['outsider','outsider']]); options('fixture',[['healthy','healthy'],['reconnecting','reconnecting'],['expired','expired']]);
    options('mode',[['quiet','quiet'],['open','open']]); options('audience',[['classmates','classmates'],['local','local'],['campus','campus']]); audienceNote();
    const viewer=$('viewer').value, fixture=$('fixture').value;
    const expired=active && fixture==='expired' && settings.audience!=='local';
    const shared=active && !expired && settings.audience!=='local';
    const unknown=shared && fixture==='reconnecting';
    const matching=viewer==='own'||viewer==='peer';
    const relevant=shared && !unknown && matching;
    const details=shared && !unknown && (matching||settings.audience==='campus');
    const activity=$('activity'); activity.replaceChildren(); activity.className='activity '+(unknown?'unknown':relevant?'':details?'apricot':'coarse');
    const title=document.createElement('strong'); title.textContent=unknown?text('unknown'):details?(viewer==='own'?text('self'):text('relevant')):shared?text('coarse'):text('none'); activity.append(title);
    if(details) { const line=document.createElement('div'); line.textContent=relevant&&settings.mode==='quiet'?text('cohortQuiet'):text(settings.mode); activity.append(line); if(settings.name){const name=document.createElement('div');name.textContent='Alex · '+text(settings.mode);activity.append(name);} }
    $('timer').textContent=settings.duration+':00';
    $('focus-state').textContent=!active?text('idle'):settings.audience==='local'?text('localActive'):expired?text('expiredText'):unknown?text('reconnectText'):text('active')+' · '+text(settings.mode);
    $('start').hidden=active&&!expired; $('start').textContent=expired?text('restart'):text('start'); $('end').hidden=!active;
    $('remembered').textContent=settings.duration+' min · '+text(settings.mode)+' · '+text(settings.audience);
    $('adjust').textContent=$('locale').value==='de'?'Sitzung anpassen':'Session settings';
    $('adjust').disabled=expired;
    const rooms=[{code:'E205',minutes:180},{code:'E203',minutes:120},{code:'E101',minutes:60}];
    const unrelated=shared&&!unknown&&!relevant;
    rooms.sort((a,b)=>(Number(unrelated&&a.code==='E203')-Number(unrelated&&b.code==='E203'))||b.minutes-a.minutes);
    $('rooms').replaceChildren(...rooms.map(room=>{const row=document.createElement('div');row.className='room-row';const code=document.createElement('strong');code.textContent=room.code;const label=document.createElement('small');label.textContent=room.code!=='E203'?text('noActivity'):unknown?text('unknownShort'):relevant?text('relevantShort'):shared?text('busyShort'):text('noActivity');const time=document.createElement('span');time.className='time';time.textContent=room.minutes+' min';row.append(code,label,time);return row;}));
  }
  $('start').addEventListener('click',()=>{active=true;$('fixture').value='healthy';render();$('end').focus();});
  $('adjust').addEventListener('click',()=>{ $('duration').value=settings.duration; $('duration').disabled=active&&$('fixture').value!=='expired'; $('mode').value=settings.mode; $('audience').value=settings.audience; $('show-name').checked=settings.name; audienceNote(); $('confirm').textContent=active?($('locale').value==='de'?'Einstellungen anwenden':'Apply settings'):text('confirm'); $('start-dialog').showModal(); });
  $('confirm').addEventListener('click',()=>{settings={duration:$('duration').value,mode:$('mode').value,audience:$('audience').value,name:$('audience').value!=='local'&&$('show-name').checked}; active=true; $('fixture').value='healthy'; $('start-dialog').close(); render(); $('end').focus();});
  $('cancel').addEventListener('click',()=> $('start-dialog').close());
  $('end').addEventListener('click',()=>{active=false;render();$('start').focus();});
  $('audience').addEventListener('change',audienceNote);
  for(const id of ['locale','viewer','fixture']) $(id).addEventListener('change',render);
  $('theme').addEventListener('change',()=>document.documentElement.dataset.theme=$('theme').value);
  render();
</script>
</body>
</html>
